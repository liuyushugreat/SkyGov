[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skygovc"
version = "1.0.0"
description = "Compiling institutional rules into an executable, auditable, tiered governance rule base for urban low-altitude operations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "compliance", "regulation-as-code", "SHACL", "SPARQL", "knowledge-graph",
    "urban-air-mobility", "low-altitude", "governance", "model-checking",
    "conformal-prediction", "NSGA-II",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "rdflib>=6.3",
    "pyshacl>=0.20",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
"Bug Tracker" = "https://github.com/liuyushugreat/SkyGov/issues"

[tool.setuptools.packages.find]
include = ["skygovc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
